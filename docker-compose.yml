version: '3.8'

services:
  # ==========================================
  # Database & Caching Services
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: irekon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-irekon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irekon_pass}
      POSTGRES_DB: ${POSTGRES_DB:-irekon_db}
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irekon} -d ${POSTGRES_DB:-irekon_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - irekon-network

  redis:
    image: redis:7-alpine
    container_name: irekon-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_HOST:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - irekon-network

  # ==========================================
  # Message Broker & Storage
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: irekon-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672" # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - irekon-network

  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: irekon-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - irekon-network

  # ==========================================
  # Application Services (Backend & Worker)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: irekon-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8005:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /var/archive/recon:/var/archive/recon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - irekon-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: irekon-worker
    restart: unless-stopped
    command: dramatiq app.workers.dramatiq_app
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /var/archive/recon:/var/archive/recon
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - irekon-network

  # ==========================================
  # Frontend Service (Next.js - Node 22)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: irekon-frontend
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8005}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8005}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - irekon-network

  # ==========================================
  # Test Storage & File Transfer Services
  # ==========================================
  ftp:
    image: delfer/alpine-ftp-server
    container_name: irekon-ftp
    restart: unless-stopped
    environment:
      - USERS=admin|admin123|/ftp/admin
    ports:
      - "2121:21"
      - "21000-21010:21000-21010"
    volumes:
      - /var/archive/recon:/ftp/admin
    networks:
      - irekon-network

  sftp:
    image: atmoz/sftp
    container_name: irekon-sftp
    restart: unless-stopped
    ports:
      - "2222:22"
    command: admin:admin123:1001:1001:upload
    volumes:
      - /var/archive/recon:/home/admin/upload
      - ./infrastructure/sftp/keys:/home/admin/.ssh/keys:ro
    networks:
      - irekon-network

  # ==========================================
  # Monitoring & Observability
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: irekon-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - irekon-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: irekon-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - irekon-network

networks:
  irekon-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
